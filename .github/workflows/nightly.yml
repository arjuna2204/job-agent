name: job-finder

on:
  schedule:
    - cron: "52 16 * * *"     # ~11:52am ET (16:52 UTC)
    - cron: "52 22 * * *"     # ~5:52pm ET (22:52 UTC)
    - cron: "41 7 * * 0"      # Sundays ~2:41am ET: discovery + poll
  workflow_dispatch:
    inputs:
      discovery:
        description: "Also run the slow company discovery"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-finder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # jobs.db is too big for git, so it lives in the Actions cache between runs
      - name: Restore job database
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobsdb-${{ github.run_id }}
          restore-keys: jobsdb-

      - name: Detect boards for new companies
        run: python finder.py detect

      - name: Check Instinct links
        if: hashFiles('data/instinct_jobs.csv') != ''
        run: python finder.py check-links data/instinct_jobs.csv

      - name: Weekly discovery (Sundays)
        if: github.event.schedule == '41 7 * * 0' || inputs.discovery == true
        run: python finder.py discover --commoncrawl --limit 1500 || true

      - name: Poll every company
        run: python finder.py poll

      - name: Sync jobs + matches to the website
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python web_sync.py || echo "website sync failed (finder results still committed)"

      - name: Save job database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/jobs.db
          key: jobsdb-${{ github.run_id }}

      - name: Commit results
        run: |
          git config user.name "job-finder-bot"
          git config user.email "job-finder-bot@users.noreply.github.com"
          git add watchlist.csv data/*.csv data/screened.txt || true
          git diff --cached --quiet || git commit -m "Nightly results $(date -u +%F)"
          git pull --rebase --autostash && git push
