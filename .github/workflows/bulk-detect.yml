name: bulk-detect
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/bulk_detect.py
      - name: Commit results
        run: |
          git config user.name "job-finder-bot"
          git config user.email "job-finder-bot@users.noreply.github.com"
          git add -f data/detected.csv
          git commit -m "Bulk board detection results" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep 10; done
